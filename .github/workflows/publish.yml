name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      # The optional peer is required at test/typecheck time (same strategy
      # as scripts/test-pi-versions.mjs). Keep in sync with that matrix.
      - name: Install pi peer for tests
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.81.1

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Trusted publishing (OIDC): no token needed. Provenance is generated automatically.
      - name: Publish to npm
        run: npm publish
